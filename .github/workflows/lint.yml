# What is the goal of your workflow
# Goal: Whenever someone changes the Python code,
# the linter will check if the syntax, format, indentation, etc. are correct.

name: Auto Linter

on:
  push:
    paths:
      - "*.py"

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      # This step will automatically clone the code
      # of the current branch into the runner
      - name: Checkout/Clone the code
        uses: actions/checkout@v7

      # This step will install the linting tool
      - name: Install linter
        run: pip install ruff
